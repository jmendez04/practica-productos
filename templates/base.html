<!DOCTYPE html>

<html lang="es">

<head>

    <!-- ==================================================
         CONFIGURACION GENERAL
         ================================================== -->

    <meta charset="UTF-8">

    <title>
        {% block title %}
        Gestión de Productos
        {% endblock %}
    </title>


    <!-- ==================================================
         ARCHIVO CSS
         ================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >

</head>


<body>


    <!-- ==================================================
         ENCABEZADO GENERAL
         ================================================== -->

    <header class="encabezado">

        <h1>Gestión de Productos</h1>

    </header>


    <!-- ==================================================
         CONTENIDO PRINCIPAL
         ================================================== -->

    <main class="contenedor">


        <!-- ==================================================
             MENSAJES DE FLASK
             ================================================== -->

        {% with mensajes = get_flashed_messages() %}

            {% if mensajes %}

                <div class="mensajes">

                    {% for mensaje in mensajes %}

                        <p>{{ mensaje }}</p>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <!-- ==================================================
             CONTENIDO DE CADA PAGINA
             ================================================== -->

        {% block content %}

        {% endblock %}


    </main>


</body>

</html>
